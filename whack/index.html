<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>창현이 때리기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#bfe6ff;
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
    box-shadow:0 0 40px rgba(0,0,0,.15)}
  #stage{position:relative;flex:1;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;top:calc(10px + env(safe-area-inset-top));padding:6px 14px;border-radius:999px;
    background:rgba(255,255,255,.85);color:#3a3a5a;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:2}
  #score{left:10px}
  #time{right:10px}
  #lives{left:50%;transform:translateX(-50%);font-size:18px;letter-spacing:2px}
  #level{left:10px;top:calc(54px + env(safe-area-inset-top));font-size:16px;padding:3px 12px;color:#fff;background:#ff8a3d}
  #level.up{animation:bump .6s}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  #sound{right:10px;left:auto;top:calc(54px + env(safe-area-inset-top));font-size:18px;padding:3px 12px;border:none;font-family:inherit;cursor:pointer}
  #controls{display:flex;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#5fae55}
  .btn{flex:1;height:84px;border:none;border-radius:20px;background:#fff;color:#ff5c9a;font-size:32px;
    font-family:inherit;box-shadow:0 6px 0 #d9d9e8;touch-action:none;cursor:pointer}
  .btn.on{transform:translateY(4px);box-shadow:0 2px 0 #d9d9e8;background:#ffe3ef}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(40,50,90,.45);z-index:5;padding:16px}
  .overlay.hide{display:none}
  .card{background:#fff;border-radius:24px;padding:26px 24px;text-align:center;width:100%;max-width:320px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);color:#3a3a5a}
  .card h1{font-size:32px;color:#ff5c9a;margin-bottom:10px;font-weight:normal}
  .card p{font-size:17px;line-height:1.6;margin-bottom:6px}
  .card .big{font-size:24px;color:#3a3a5a}
  .card .big b{color:#ff5c9a;font-weight:normal}
  .card .sub{font-size:15px;color:#8a8aa8}
  .card button{margin-top:16px;border:none;border-radius:999px;background:#ff5c9a;color:#fff;
    font-family:inherit;font-size:22px;padding:12px 34px;box-shadow:0 5px 0 #d63f7c;cursor:pointer}
  .card button:active{transform:translateY(3px);box-shadow:0 2px 0 #d63f7c}
  .card .home{display:inline-block;margin-top:12px;color:#8a8aa8;font-size:16px;text-decoration:none}
  .card .line{font-size:16px;color:#8a8aa8;margin-bottom:8px}
  .card .line b{color:#3a3a5a;font-weight:normal}
  .newrec{background:#fff4e0;border-radius:16px;padding:10px 12px;margin:6px 0 10px;color:#ff8a3d;font-size:19px}
  .newrec.hide{display:none}
  .newrec form{display:flex;gap:6px;margin-top:8px}
  .newrec input{flex:1;min-width:0;font-family:inherit;font-size:18px;padding:8px 12px;border:2px solid #ffc999;border-radius:12px;
    outline:none;color:#3a3a5a;user-select:text;-webkit-user-select:text;touch-action:auto}
  .newrec input:focus{border-color:#ff8a3d}
  .newrec input.need{border-color:#ff4d6d;animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .card .newrec button{margin:0;padding:8px 16px;font-size:18px;background:#ff8a3d;box-shadow:0 4px 0 #d96a22}
  .newrec .done{color:#3aa55b;font-size:17px}
  .rank{list-style:none;text-align:left;margin:4px 0 0;border-top:2px dashed #eee}
  .rank li{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:2px dashed #eee;font-size:18px}
  .rank .md{width:26px;text-align:center}
  .rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .sc{color:#ff5c9a}
  .rank .tm{width:46px;text-align:right;color:#a0a0bb;font-size:14px}
  .rank li.me{background:#fff0f6;border-radius:10px}
  .rank li.empty{color:#c9c9da}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hud" id="score">점수 0</div>
    <div class="hud" id="level">Lv.1</div>
    <div class="hud" id="lives">❤️❤️❤️</div>
    <div class="hud" id="time">⏱ 00:00</div>
    <button class="hud" id="sound" aria-label="소리 켜기/끄기">🔊</button>

    <div class="overlay" id="startOv">
      <div class="card">
        <h1>창현이 때리기</h1>
        <p>구멍에서 튀어나오는 <b style="color:#c0392b;font-weight:normal">창현</b>이를 뿅망치로 콩!<br>
           <b style="color:#ff5c9a;font-weight:normal">진경</b>이는 때리면 <b style="color:#ff4d6d;font-weight:normal">-3점</b>이에요</p>
        <p class="sub">나온 얼굴을 터치 (PC는 클릭 · 숫자키 1~9)<br>창현이를 놓치면 방구 뿡! 목숨 -1 (총 3개)<br>15초마다 레벨 UP! 점점 빨라져요</p>
        <p class="sub" id="topLine" style="color:#ff8a3d"></p>
        <button id="startBtn">시작하기</button><br>
        <a class="home" href="../">← 게임 목록</a>
      </div>
    </div>

    <div class="overlay hide" id="overOv">
      <div class="card">
        <h1 style="margin-bottom:4px">게임 종료</h1>
        <p class="big">점수 <b id="finalScore">0</b>점</p>
        <p class="line">플레이 시간 <b id="finalTime">00:00</b> · 도달 레벨 <b id="finalLevel">1</b></p>
        <div class="newrec hide" id="newRec">
          <div id="newRecMsg">🎉 기록 갱신! <span id="newRank">1</span>위</div>
          <form id="nameForm" autocomplete="off">
            <input id="nameInput" maxlength="8" placeholder="이름을 적어 주세요" enterkeyhint="done">
            <button type="submit">등록</button>
          </form>
        </div>
        <ol class="rank" id="rankList"></ol>
        <p class="sub" id="rankNote" style="margin-top:6px"></p>
        <button id="restartBtn">다시 시작</button><br>
        <a class="home" href="../">← 게임 목록</a>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $score = document.getElementById('score');
  const $time = document.getElementById('time');
  const $lives = document.getElementById('lives');
  const $level = document.getElementById('level');
  const $sound = document.getElementById('sound');
  const startOv = document.getElementById('startOv');
  const overOv = document.getElementById('overOv');

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmt = sec => {
    const s = Math.floor(sec);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };

  let W = 0, H = 0, S = 1;
  // ---------- 화면 배치 (3 x 3 구멍) ----------
  const GRID_TOP = 96;
  function grid() {
    const top = GRID_TOP, bottom = H - 14;
    const cw = W / 3, ch = (bottom - top) / 3;
    const k = Math.max(0.55, Math.min(1.5, Math.min(cw / 118, ch / 150)));
    return { top, cw, ch, k };
  }
  function holePos(i) {
    const g = grid(), c = i % 3, r = Math.floor(i / 3);
    return { x: g.cw * (c + 0.5), y: g.top + g.ch * (r + 0.72), k: g.k, cw: g.cw, ch: g.ch };
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    const wasEmpty = W < 10;
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(0.65, Math.min(1.4, Math.min(W / 400, H / 640)));
    if (wasEmpty && W >= 10) initDeco();
  }

  // ---------- 효과음 (방구 피하기와 같은 소리) ----------
  let actx = null, master = null, muted = false;
  try { muted = localStorage.getItem('bangguMute') === '1'; } catch (_) {}
  $sound.textContent = muted ? '🔇' : '🔊';
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  $sound.addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    $sound.textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('bangguMute', muted ? '1' : '0'); } catch (_) {}
    if (!muted) { audio(); sfx.dodge(); }
  });
  $sound.addEventListener('pointerdown', e => e.stopPropagation());
  function tone(type, f1, f2, dur, vol, delay = 0, lp = 0, vib = 0) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = o;
    if (lp) { const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); node = f; }
    if (vib) {
      const lfo = a.createOscillator(), lg = a.createGain();
      lfo.frequency.value = vib; lg.gain.value = f1 * 0.08;
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t0); lfo.stop(t0 + dur);
    }
    node.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  let lastDodge = 0;
  const sfx = {
    fart() {
      const p = rand(0.85, 1.2);
      tone('square', 190 * p, 95 * p, 0.26, 0.16, 0, 700, 28);
      tone('sine', 380 * p, 520 * p, 0.09, 0.08, 0.2);
    },
    dodge() {
      const now = performance.now(); if (now - lastDodge < 70) return; lastDodge = now;
      tone('sine', 1046, 1568, 0.09, 0.12);
    },
    bonk() {   // 뿅망치 소리
      tone('square', 1300, 420, 0.07, 0.1, 0, 2600);
      tone('triangle', 320, 130, 0.14, 0.24, 0.01);
    },
    whiff() { tone('sine', 260, 180, 0.06, 0.06); },
    hit() {
      tone('triangle', 620, 160, 0.35, 0.3);
      tone('sine', 300, 90, 0.3, 0.18, 0.05);
    },
    levelUp() { [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, f, 0.14, 0.18, i * 0.09)); },
    start() { [392, 523, 659].forEach((f, i) => tone('sine', f, f * 1.02, 0.12, 0.16, i * 0.07)); },
    over() { [523, 440, 349, 262].forEach((f, i) => tone('triangle', f, f * 0.97, 0.22, 0.2, i * 0.16)); },
  };

  // ---------- 난이도 ----------
  const LEVEL_SEC = 15;
  function diff(lv) {
    const n = lv - 1;
    return {
      interval: Math.max(0.3, 1.0 * Math.pow(0.88, n)),   // 다음 얼굴이 나오는 간격(초)
      stay: Math.max(0.55, 1.5 * Math.pow(0.9, n)),       // 얼굴을 내밀고 있는 시간(초)
      maxUp: Math.min(4, 1 + Math.floor((lv + 1) / 2)),   // 동시에 나오는 최대 수
      fake: Math.min(0.35, 0.15 + n * 0.03),              // 가짜 진경이가 나올 확률
    };
  }

  // ---------- 상태 ----------
  let state = 'ready';
  let holes, pops, sparks, puffs, hammers, score, lives, elapsed, spawnT, shake, level, banner;
  const deco = [];

  function reset() {
    holes = Array.from({ length: 9 }, () => null);
    pops = []; sparks = []; puffs = []; hammers = [];
    score = 0; lives = 3; elapsed = 0; spawnT = 0.8; shake = 0; level = 1; banner = null;
    const m = location.hash.match(/lv=(\d+)/);   // 테스트용: #lv=5
    if (m) { level = Math.max(1, +m[1]); elapsed = (level - 1) * LEVEL_SEC; }
    updateHud();
  }

  function updateHud() {
    $score.textContent = '점수 ' + score;
    $level.textContent = 'Lv.' + level;
    $time.textContent = '⏱ ' + fmt(elapsed);
    $lives.textContent = '❤️'.repeat(lives) + '🤍'.repeat(3 - lives);
  }

  function initDeco() {
    deco.length = 0;
    for (let i = 0; i < 4; i++) deco.push({ x: rand(0, W), y: rand(18, 70), s: rand(0.5, 0.85), v: rand(6, 14) });
  }

  // ---------- 때리기 ----------
  function hit(i) {
    const o = holes[i];
    if (!o || o.hit || o.up < 0.35) return false;
    const hp = holePos(i);
    o.hit = true; o.phase = 'hit'; o.t = 0;
    if (o.type === 'bandit') {
      score++;
      sfx.bonk();
      addPop(hp.x, hp.y - 112 * hp.k, '뿅!', '#ff5c9a', 26);
      addSparks(hp.x, hp.y - 60 * hp.k, 8, ['#ffd84d', '#ffffff', '#ffb3d1']);
    } else {
      score = Math.max(0, score - 3);
      sfx.hit(); shake = 0.25;
      addPop(hp.x, hp.y - 100 * hp.k, '-3 진경이에요!', '#ff4d6d', 20);
    }
    updateHud();
    return true;
  }

  function tapAt(x, y) {
    if (state !== 'play') return;
    hammers.push({ x, y, t: 0 });
    let best = -1, bestD = 1e9;
    for (let i = 0; i < 9; i++) {
      const hp = holePos(i), o = holes[i];
      if (!o || o.hit || o.up < 0.35) continue;
      if (Math.abs(x - hp.x) > hp.cw * 0.48) continue;
      if (y < hp.y - 120 * hp.k || y > hp.y + 30 * hp.k) continue;
      const d = Math.abs(y - (hp.y - 50 * hp.k));
      if (d < bestD) { bestD = d; best = i; }
    }
    if (best < 0 || !hit(best)) sfx.whiff();
  }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    tapAt(e.clientX - r.left, e.clientY - r.top);
  });

  // 키보드: 숫자패드 배치 (7 8 9 / 4 5 6 / 1 2 3)
  const KEYMAP = { '7': 0, '8': 1, '9': 2, '4': 3, '5': 4, '6': 5, '1': 6, '2': 7, '3': 8 };
  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (state === 'play' && e.key in KEYMAP) {
      const hp = holePos(KEYMAP[e.key]);
      tapAt(hp.x, hp.y - 50 * hp.k);
    }
    if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') { e.preventDefault(); start(); }
  });

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('restartBtn').addEventListener('click', start);

  function start() {
    reset();
    audio(); sfx.start();
    state = 'play';
    startOv.classList.add('hide');
    overOv.classList.add('hide');
  }

  // ---------- 순위표 (1~3위) ----------
  // SCORE_API(구글 시트 웹 앱 주소)가 있으면 모든 휴대폰이 같은 순위표를 함께 봄.
  // 주소가 없거나 인터넷이 안 되면 이 기기에 저장해 두었다가 다음에 연결될 때 올림.
  // 실제 사이트에서만 공유 순위표에 기록 (내 컴퓨터에서 시험할 때는 기록 안 함)
  const SCORE_API = location.hostname === 'banggu-game.github.io' ? 'https://script.google.com/macros/s/AKfycbxFh6d1QfYNMH7mYke5bS39mkml2xjWmmX-KQt6wigUHDYe5I5xGHBnDM4NKC5YdGar0g/exec' : '';
  const GAME_ID = 'whack';
  const RANK_KEY = 'rank_whack', OLD_BEST = 'whackBest', PEND_KEY = 'pend_whack', SYNC_KEY = 'synced_whack';
  const $newRec = document.getElementById('newRec');
  const $nameForm = document.getElementById('nameForm');
  const $nameInput = document.getElementById('nameInput');
  const $rankList = document.getElementById('rankList');
  const $rankNote = document.getElementById('rankNote');
  const $topLine = document.getElementById('topLine');
  let myEntry = null, reqNo = 0, busy = false;
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const lsGet = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
  const jsonList = k => { try { const v = JSON.parse(lsGet(k)); return Array.isArray(v) ? v : null; } catch (_) { return null; } };

  function saveRank(list) { lsSet(RANK_KEY, JSON.stringify(list)); }
  function loadRank() {
    let list = jsonList(RANK_KEY);
    if (!list) {
      // 예전 최고 점수가 있으면 '진경' 이름으로 옮겨 넣기
      list = [];
      const ob = +lsGet(OLD_BEST) || 0;
      if (ob > 0) list.push({ name: '진경', score: ob, time: null, id: newId() });
      saveRank(list);
    }
    return list.filter(e => e && typeof e.score === 'number').map(e => Object.assign({}, e, { id: String(e.id) })).slice(0, 3);
  }
  function addLocal(entry) {
    const list = loadRank();
    let pos = list.findIndex(e => entry.score > e.score);
    if (pos < 0) pos = list.length;
    if (pos < 3) { list.splice(pos, 0, entry); list.length = Math.min(list.length, 3); saveRank(list); }
    return list;
  }
  function renameLocal(id, nm) {
    const list = loadRank();
    const it = list.find(x => x.id === id);
    if (it) { it.name = nm; saveRank(list); }
    const p = jsonList(PEND_KEY) || [];
    const pi = p.find(x => String(x.id) === id);
    if (pi) { pi.name = nm; lsSet(PEND_KEY, JSON.stringify(p)); }
    return list;
  }
  function addPending(e) {
    const p = jsonList(PEND_KEY) || [];
    if (!p.some(x => String(x.id) === e.id)) { p.push(e); lsSet(PEND_KEY, JSON.stringify(p)); }
  }

  async function api(body) {
    if (!SCORE_API) throw new Error('주소 없음');
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 9000);
    try {
      const res = body
        ? await fetch(SCORE_API, { method: 'POST', body: JSON.stringify(Object.assign({ game: GAME_ID }, body)), signal: ctrl.signal })
        : await fetch(SCORE_API + '?game=' + GAME_ID + '&t=' + Date.now(), { signal: ctrl.signal });
      const j = await res.json();
      if (!j.ok || !Array.isArray(j.list)) throw new Error('응답 이상');
      return j.list.map(e => Object.assign({}, e, { id: String(e.id) }));
    } finally { clearTimeout(to); }
  }

  // 못 올린 기록(예전 기록 포함)을 공유 순위표로 올리기
  async function flushPending() {
    if (!SCORE_API) return;
    if (!lsGet(SYNC_KEY)) {
      for (const e of loadRank()) addPending(e);
      lsSet(SYNC_KEY, '1');
    }
    const p = jsonList(PEND_KEY) || [];
    for (const e of p) {
      try {
        await api({ action: 'add', id: String(e.id), name: e.name, score: e.score, time: e.time });
        const now = (jsonList(PEND_KEY) || []).filter(x => String(x.id) !== String(e.id));
        lsSet(PEND_KEY, JSON.stringify(now));
      } catch (_) { break; }
    }
  }

  function renderRank(list) {
    $rankList.innerHTML = '';
    if (!list) {
      const li = document.createElement('li'); li.className = 'empty';
      li.textContent = '⏳ 순위 불러오는 중…';
      $rankList.appendChild(li);
      return;
    }
    const medals = ['🥇', '🥈', '🥉'];
    for (let i = 0; i < 3; i++) {
      const e = list[i];
      const li = document.createElement('li');
      const md = document.createElement('span'); md.className = 'md'; md.textContent = medals[i];
      const nm = document.createElement('span'); nm.className = 'nm';
      const sc = document.createElement('span'); sc.className = 'sc';
      const tm = document.createElement('span'); tm.className = 'tm';
      if (e) {
        nm.textContent = e.name;
        sc.textContent = e.score + '점';
        tm.textContent = e.time == null ? '' : fmt(e.time);
        if (myEntry && e.id === myEntry.id) li.className = 'me';
      } else {
        li.className = 'empty'; nm.textContent = '아직 없음';
      }
      li.append(md, nm, sc, tm);
      $rankList.appendChild(li);
    }
  }
  function showNew(list) {
    const pos = myEntry ? list.findIndex(e => e.id === myEntry.id) : -1;
    if (pos >= 0) {
      document.getElementById('newRecMsg').textContent = '🎉 기록 갱신! ' + (pos + 1) + '위';
      $nameInput.value = '';
      $nameInput.placeholder = '이름을 적어 주세요';
      $nameInput.classList.remove('need');
      $nameForm.style.display = '';
      $newRec.classList.remove('hide');
    } else {
      $newRec.classList.add('hide');

  }
  function note(shared) {
    $rankNote.textContent = !SCORE_API ? '' : shared ? '🌏 모두가 함께 보는 순위표예요' : '📵 인터넷 연결이 안 돼서 이 폰의 기록만 보여요';
  }

  async function recordScore() {
    const my = ++reqNo;
    myEntry = null;
    $newRec.classList.add('hide');
    if (score > 0) myEntry = { id: newId(), name: '이름 없음', score, time: Math.floor(elapsed) };
    let list = myEntry ? addLocal(myEntry) : loadRank();
    if (!SCORE_API) { renderRank(list); showNew(list); note(false); return; }
    renderRank(null); $rankNote.textContent = '';
    let shared = true;
    try {
      list = myEntry
        ? await api({ action: 'add', id: myEntry.id, name: myEntry.name, score: myEntry.score, time: myEntry.time })
        : await api();
    } catch (_) {
      shared = false;
      if (myEntry) addPending(myEntry);
    }
    if (my !== reqNo) return;
    renderRank(list); showNew(list); note(shared);
  }

  $nameForm.addEventListener('submit', async e => {
    e.preventDefault();

    const nm = $nameInput.value.trim().slice(0, 8);
    if (!nm) {
      $nameInput.placeholder = '이름을 먼저 적어 주세요!';
      $nameInput.classList.remove('need'); void $nameInput.offsetWidth; $nameInput.classList.add('need');
      $nameInput.focus();
      return;
    }
    myEntry.name = nm;
    $nameInput.blur();
    let list = renameLocal(myEntry.id, nm);

    const msg = document.getElementById('newRecMsg');
    msg.textContent = '⏳ 등록하는 중…';
    let shared = !!SCORE_API;
    if (SCORE_API) {
      busy = true;
      try { list = await api({ action: 'rename', id: myEntry.id, name: nm }); }
      catch (_) { shared = false; }
      busy = false;
    }
    msg.textContent = '';
    const done = document.createElement('span'); done.className = 'done';
    done.textContent = '✔ ' + nm + ' 이름으로 등록했어요!';

  // ---------- 그리기 도우미 ----------
  function el(x, y, rx, ry, fill, rot = 0) {
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
  }
  function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

  function drawCloud(x, y, s, alpha = 0.9) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 20 * s, y - 8 * s, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 42 * s, y, 17 * s, 0, Math.PI * 2);
    ctx.rect(x, y, 42 * s, 17 * s);
    ctx.fill();
    ctx.restore();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, GRID_TOP);
    g.addColorStop(0, '#7cc6f5'); g.addColorStop(1, '#bfe6ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, GRID_TOP + 20);
    for (const c of deco) drawCloud(c.x, c.y, c.s * S, 0.75);
    const gt = GRID_TOP - 12;
    ctx.fillStyle = '#7fd36f';
    ctx.beginPath(); ctx.moveTo(0, gt + 8);
    const step = W / 4;
    for (let x = 0; x < W; x += step) ctx.quadraticCurveTo(x + step / 2, gt - 8, x + step, gt + 8);
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#69bf5b'; ctx.lineWidth = 4; ctx.stroke();
    for (let i = 0; i < 16; i++) {
      const fx = ((i * 37 + 11) % 100) / 100 * W;
      const fy = gt + 24 + ((i * 61 + 7) % 100) / 100 * (H - gt - 34);
      el(fx, fy, 3 * S, 3 * S, i % 3 === 0 ? '#fff4a3' : '#ffd1e3');
    }
  }

  const ease = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);

  function drawHole(i, t) {
    const hp = holePos(i), k = hp.k, o = holes[i];
    const rx = 44 * k, ry = 15 * k;
    el(hp.x, hp.y + 5 * k, rx + 13 * k, ry + 9 * k, '#c99a6b');   // 흙 둔덕
    el(hp.x, hp.y, rx, ry, '#4a3326');                             // 구멍
    if (o && o.up > 0) {
      const e = ease(o.up);
      ctx.save();
      ctx.beginPath();
      ctx.rect(hp.x - hp.cw / 2, hp.y - hp.ch, hp.cw, hp.ch);      // 구멍 선 위쪽만 보이게
      ctx.ellipse(hp.x, hp.y, rx, ry, 0, 0, Math.PI * 2);
      ctx.clip();
      if (o.type === 'bandit') {
        const by = hp.y + 40 * k - e * 92 * k;
        drawBandit({ x: hp.x, y: by, k, squish: o.squish, dizzy: o.hit }, t);
        if (o.hit) {   // 머리 위 빙글빙글 별
          for (let j = 0; j < 3; j++) {
            const a = t * 7 + j * 2.1;
            ctx.font = `${Math.round(14 * k)}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('⭐', hp.x + Math.cos(a) * 26 * k, by - 38 * k + Math.sin(a) * 7 * k);
          }
        }
      } else {
        drawGirl({ x: hp.x, y: hp.y + 112 * k - e * 56 * k, k, hurt: o.hit }, t);
      }
      ctx.restore();
    }
    // 앞쪽 흙 테두리
    ctx.beginPath(); ctx.ellipse(hp.x, hp.y, rx, ry, 0, 0.05, Math.PI - 0.05);
    ctx.lineWidth = 7 * k; ctx.strokeStyle = '#b5845a'; ctx.lineCap = 'round'; ctx.stroke();
    if (o && o.up > 0.3) {
      drawLabel(o.type === 'bandit' ? '창현' : '진경', hp.x, hp.y + ry + 14 * k, o.type === 'bandit' ? '#c0392b' : '#ff3d8b');
    }
  }

  // 뿅망치
  function drawHammer(h) {
    const p = h.t / 0.22;
    const ang = -1.15 + Math.min(1, p * 3.5) * 1.3;
    ctx.save();
    ctx.globalAlpha = p > 0.7 ? 1 - (p - 0.7) / 0.3 : 1;
    ctx.translate(h.x + 38 * S, h.y + 40 * S);
    ctx.rotate(ang);
    ctx.fillStyle = '#ffcf3f';
    ctx.fillRect(-3.5 * S, -58 * S, 7 * S, 58 * S);
    ctx.fillStyle = '#e8a92a';
    ctx.fillRect(-3.5 * S, -12 * S, 7 * S, 12 * S);
    const hx = -8 * S, hy = -68 * S, hw = 54 * S, hh = 28 * S;
    ctx.fillStyle = '#ff6fa8';
    ctx.fillRect(hx - hw / 2, hy - hh / 2, hw, hh);
    ctx.fillStyle = '#fff';
    ctx.fillRect(hx - 6 * S, hy - hh / 2, 5 * S, hh);
    ctx.fillRect(hx + 6 * S, hy - hh / 2, 5 * S, hh);
    el(hx - hw / 2, hy, 7 * S, hh / 2, '#ff4d8d');
    el(hx + hw / 2, hy, 7 * S, hh / 2, '#ff8fbd');
    ctx.restore();
  }

  // ---------- 창현 (안경 쓴 수염 산적) ----------
  const SKIN = '#f3c48c';
  function drawBandit(b, t) {
    ctx.save();
    ctx.translate(b.x, b.y);
    const sq = b.squish;
    ctx.translate(0, 77 * b.k);                         // 발 기준으로 찌그러지게
    ctx.scale(b.k * (1 + sq * 0.12), b.k * (1 - sq * 0.12));
    ctx.translate(0, -77);
    ctx.lineCap = 'round';

    // 다리 (서 있음)
    ctx.strokeStyle = '#4a3b2a'; ctx.lineWidth = 10;
    line(-10, 55, -12, 73); line(10, 55, 12, 73);
    el(-14, 77, 9, 5, '#2b2b2b'); el(14, 77, 9, 5, '#2b2b2b');

    // 팔 (허리에 손)
    const aw = Math.sin(t * 3) * 3;
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 9;
    line(-22, 30, -38, 42 + aw); line(-38, 42 + aw, -26, 52);
    line(22, 30, 38, 42 - aw); line(38, 42 - aw, 26, 52);
    el(-25, 52, 5.5, 5.5, SKIN); el(25, 52, 5.5, 5.5, SKIN);

    // 몸통 + 조끼
    el(0, 40, 27, 24, '#c0392b');
    ctx.fillStyle = '#6b4226';
    ctx.beginPath(); ctx.moveTo(-25, 28); ctx.quadraticCurveTo(-31, 50, -18, 62); ctx.lineTo(-6, 63); ctx.lineTo(-5, 20); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(25, 28); ctx.quadraticCurveTo(31, 50, 18, 62); ctx.lineTo(6, 63); ctx.lineTo(5, 20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2b1d12'; ctx.fillRect(-26, 50, 52, 7);
    ctx.strokeStyle = '#f4c542'; ctx.lineWidth = 2.5; ctx.strokeRect(-5, 48.5, 10, 10);

    // 머리
    el(-27, 4, 5, 7, SKIN); el(27, 4, 5, 7, SKIN);
    el(0, 0, 28, 28, SKIN);

    // 턱수염
    ctx.fillStyle = '#3b2414';
    ctx.beginPath();
    ctx.moveTo(-28, 0);
    ctx.quadraticCurveTo(-31, 30, -13, 40);
    ctx.quadraticCurveTo(0, 50, 13, 40);
    ctx.quadraticCurveTo(31, 30, 28, 0);
    ctx.quadraticCurveTo(20, 14, 10, 12);
    ctx.quadraticCurveTo(0, 10, -10, 12);
    ctx.quadraticCurveTo(-20, 14, -28, 0);
    ctx.fill();
    for (let i = -2; i <= 2; i++) el(i * 8, 40 + (2 - Math.abs(i)) * 2, 6, 6, '#3b2414');

    el(0, 22, sq > 0.3 ? 4 : 6, sq > 0.3 ? 4.5 : 2.6, '#9b4a4a');
    el(-9, 14, 11, 4.5, '#2a180c', -0.25); el(9, 14, 11, 4.5, '#2a180c', 0.25);
    el(0, 8, 5.5, 4.5, '#e2a465');

    // 두건
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(0, -2, 29.5, Math.PI, Math.PI * 2);
    ctx.quadraticCurveTo(0, -22, -29.5, -2);
    ctx.fill();
    [[-14, -18], [0, -24], [14, -18], [-20, -8], [20, -8]].forEach(([x, y]) => el(x, y, 2.2, 2.2, '#fff'));
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.moveTo(26, -12); ctx.lineTo(44, -4 + Math.sin(t * 6) * 3); ctx.lineTo(36, -10); ctx.lineTo(44, -20 + Math.sin(t * 6 + 1) * 3); ctx.closePath(); ctx.fill();
    el(27, -11, 5, 5, '#c0392b');

    ctx.strokeStyle = '#2a180c'; ctx.lineWidth = 4;
    line(-19, -12, -5, -10); line(19, -12, 5, -10);

    if (b.dizzy) {   // 맞으면 X X 눈
      ctx.strokeStyle = '#222'; ctx.lineWidth = 2.2;
      line(-14, -4, -8, 2); line(-14, 2, -8, -4); line(8, -4, 14, 2); line(8, 2, 14, -4);
    } else if (sq > 0.3) {
      ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(-11, 0, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(11, 0, 3.5, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else {
      el(-11, -1, 2.6, 2.8, '#222'); el(11, -1, 2.6, 2.8, '#222');
    }

    // 안경
    ctx.fillStyle = 'rgba(190,225,255,0.35)';
    ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(-11, -1, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(11, -1, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    line(-2, -2, 2, -2); line(-20, -3, -27, -4); line(20, -3, 27, -4);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.6;
    line(-15, -5, -12, -8); line(7, -5, 10, -8);

    ctx.restore();
  }

  // ---------- 진경 (검은 긴머리) ----------
  const SKIN2 = '#ffe1cf';
  const HAIR = '#151515';
  function drawGirl(p, t) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(p.k, p.k);
        ctx.lineCap = 'round';
    const running = false;
    const air = false;
    const run = running && !air ? Math.sin(t * 18) : 0;
    const bob = running && !air ? Math.abs(Math.sin(t * 18)) * -3 : 0;
    ctx.translate(0, bob);
    ctx.rotate(running ? 0.07 : 0);
    const sway = running ? -8 - (air ? 4 : 0) + Math.sin(t * 9) * 2 : 0;   // 머리카락이 뒤로 날림
    const hurt = !!p.hurt;

    // 뒷머리
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.moveTo(-23, -86);
    ctx.quadraticCurveTo(-31, -56, -25 + sway, -30 - (air ? 4 : 0));
    ctx.quadraticCurveTo(sway, -24, 25 + sway * 0.5, -30);
    ctx.quadraticCurveTo(31, -56, 23, -86);
    ctx.closePath(); ctx.fill();
    el(0, -82, 25, 26, HAIR);

    // 다리 + 신발
    ctx.strokeStyle = SKIN2; ctx.lineWidth = 6;
    if (air) {
      line(-6, -22, -12, -12); line(6, -22, 10, -10);
      el(-13, -10, 6.5, 3.6, '#e84a8a'); el(11, -8, 6.5, 3.6, '#e84a8a');
    } else {
      line(-6, -22, -6 - run * 8, -4); line(6, -22, 6 + run * 8, -4);
      el(-7 - run * 8, -2, 6.5, 3.6, '#e84a8a'); el(7 + run * 8, -2, 6.5, 3.6, '#e84a8a');
    }

    // 팔
    ctx.lineWidth = 5;
    if (air) { line(-12, -52, -22, -66); line(12, -52, 22, -66); }
    else { line(-12, -52, -20 + run * 6, -34); line(12, -52, 20 - run * 6, -34); }

    // 원피스
    ctx.fillStyle = '#ff6fa8';
    ctx.beginPath();
    ctx.moveTo(-12, -57); ctx.lineTo(12, -57); ctx.lineTo(23, -18);
    ctx.quadraticCurveTo(0, -14, -23, -18); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-7, -57); ctx.lineTo(0, -50); ctx.lineTo(7, -57); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd1e3'; ctx.fillRect(-15, -42, 30, 4);

    // 목 + 얼굴
    ctx.fillStyle = SKIN2; ctx.fillRect(-3.5, -62, 7, 7);
    el(0, -78, 18, 20, SKIN2);

    // 앞머리
    ctx.fillStyle = HAIR;
    ctx.beginPath();
    ctx.moveTo(-20, -78);
    ctx.quadraticCurveTo(-23, -105, 0, -104);
    ctx.quadraticCurveTo(23, -105, 20, -78);
    ctx.quadraticCurveTo(15, -90, 7, -87);
    ctx.quadraticCurveTo(0, -93, -6, -87);
    ctx.quadraticCurveTo(-15, -90, -20, -78);
    ctx.fill();
    ctx.strokeStyle = HAIR; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-19, -82); ctx.quadraticCurveTo(-22, -64, -19 + sway * 0.4, -50); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(19, -82); ctx.quadraticCurveTo(22, -64, 19 + sway * 0.4, -50); ctx.stroke();

    el(-13, -95, 4.5, 3, '#ffcf3f', -0.4);

    if (hurt) {
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1.8;
      line(-10, -79, -5, -76); line(-10, -73, -5, -76);
      line(10, -79, 5, -76); line(10, -73, 5, -76);
    } else {
      el(-7, -76, 2.8, 3.6, '#222'); el(7, -76, 2.8, 3.6, '#222');
      el(-6, -77.5, 1, 1.2, '#fff'); el(8, -77.5, 1, 1.2, '#fff');
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1.2;
      line(-9.5, -79, -11.5, -81); line(9.5, -79, 11.5, -81);
    }
    el(-11.5, -70, 3.6, 2.1, 'rgba(255,120,150,.55)');
    el(11.5, -70, 3.6, 2.1, 'rgba(255,120,150,.55)');
    ctx.strokeStyle = '#d9536f'; ctx.lineWidth = 1.6;
    if (hurt) { el(0, -68, 2.2, 2.6, '#d9536f'); }
    else if (air) { el(0, -68.5, 2.6, 2.2, '#d9536f'); }
    else { ctx.beginPath(); ctx.arc(0, -70, 3.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }

    ctx.restore();
  }

  function drawLabel(text, x, y, color) {
    ctx.save();
    ctx.font = `${Math.round(17 * S)}px Jua, 'Malgun Gothic', sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 4 * S; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color; ctx.fillText(text, x, y);
    ctx.restore();
  }

  // ---------- 방구 구름 (같은 모양) ----------
  function drawPuff(p) {
    ctx.save();
    const y = p.y;
    ctx.translate(p.x, y);
    const r = p.r * p.grow;
    // 뒤쪽 잔상
    for (let i = 1; i <= 3; i++) {
      ctx.globalAlpha = 0.28 / i * p.grow * p.alpha;
      el(Math.sin(p.t * 5 + i) * r * 0.2, r * (0.85 + i * 0.5), r * (0.42 - i * 0.07), r * (0.42 - i * 0.07), '#dff7d6');
    }
    ctx.globalAlpha = p.alpha;
    ctx.rotate(Math.sin(p.t * 3 + p.ph) * 0.12);
    const k = 1 + Math.sin(p.t * 7 + p.ph) * 0.06;
    ctx.scale(k, 1 / k);
    const blobs = [[0, 0.05, 0.8], [-0.55, 0.2, 0.55], [0.55, 0.2, 0.55], [-0.25, -0.4, 0.5], [0.3, -0.38, 0.52]];
    ctx.fillStyle = '#86cf7d';
    for (const [bx, by, br] of blobs) { ctx.beginPath(); ctx.arc(bx * r, by * r, br * r + 2, 0, Math.PI * 2); ctx.fill(); }
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 1.2);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#e3f8d8'); g.addColorStop(1, '#b6e8a8');
    ctx.fillStyle = g;
    for (const [bx, by, br] of blobs) { ctx.beginPath(); ctx.arc(bx * r, by * r, br * r, 0, Math.PI * 2); ctx.fill(); }
    el(-r * 0.22, r * 0.02, r * 0.07, r * 0.09, '#4d6b48');
    el(r * 0.22, r * 0.02, r * 0.07, r * 0.09, '#4d6b48');
    ctx.strokeStyle = '#4d6b48'; ctx.lineWidth = Math.max(1.2, r * 0.06); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, r * 0.14, r * 0.13, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    el(-r * 0.4, r * 0.2, r * 0.1, r * 0.06, 'rgba(255,150,170,.6)');
    el(r * 0.4, r * 0.2, r * 0.1, r * 0.06, 'rgba(255,150,170,.6)');
    ctx.restore();
  }

  // ---------- 효과 ----------
  function addPop(x, y, text, color, size = 22) { pops.push({ x, y, text, color, size, t: 0, life: 0.9 }); }
  function addSparks(x, y, n, colors) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(60, 180) * S;
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40 * S, t: 0, life: rand(0.4, 0.8), r: rand(3, 6) * S, c: colors[i % colors.length] });
    }
  }

  // ---------- 창현이를 놓치면 방구 뿡 ----------
  function escape(i, o) {
    const hp = holePos(i);
    o.squish = 1;
    lives--; shake = 0.15;
    sfx.fart();
    addPop(hp.x, hp.y - 112 * hp.k, '뿡! 놓쳤다', '#a46bd8', 20);
    puffs.push({ x: hp.x + rand(-8, 8) * hp.k, y: hp.y - 30 * hp.k, r: 17 * hp.k, t: 0, ph: rand(0, 6), grow: 0.3, alpha: 1 });
    updateHud();
    if (lives <= 0) { lives = 0; updateHud(); gameOver(); }
  }

  // ---------- 업데이트 ----------
  function update(dt, t) {
    for (const c of deco) { c.x += c.v * dt; if (c.x > W + 40) c.x = -110 * S; }

    if (state === 'play') {
      elapsed += dt;
      const nl = 1 + Math.floor(elapsed / LEVEL_SEC);
      if (nl > level) {
        level = nl;
        banner = { t: 0, text: '레벨 UP! Lv.' + level };
        $level.classList.remove('up'); void $level.offsetWidth; $level.classList.add('up');
        sfx.levelUp();
      }
      const d = diff(level);
      spawnT -= dt;
      const active = holes.filter(o => o && !o.hit).length;
      if (spawnT <= 0 && active < d.maxUp) {
        const free = [];
        holes.forEach((o, i) => { if (!o) free.push(i); });
        if (free.length) {
          const i = free[Math.floor(Math.random() * free.length)];
          holes[i] = { type: Math.random() < d.fake ? 'girl' : 'bandit', phase: 'rise', t: 0, up: 0,
                       stay: d.stay * rand(0.85, 1.15), hit: false, squish: 0 };
          spawnT = d.interval * rand(0.7, 1.3);
        }
      }
    }
    if (banner) { banner.t += dt; if (banner.t > 1.6) banner = null; }

    for (let i = 0; i < 9; i++) {
      const o = holes[i];
      if (!o) continue;
      o.t += dt;
      o.squish = Math.max(0, o.squish - dt * 3);
      if (o.phase === 'rise') {
        o.up = Math.min(1, o.up + dt / 0.13);
        if (o.up >= 1) { o.phase = 'stay'; o.t = 0; }
      } else if (o.phase === 'stay') {
        if (state === 'over' || (state === 'play' && o.t >= o.stay)) {
          o.phase = 'fall'; o.t = 0;
          if (state === 'play' && o.type === 'bandit') escape(i, o);
        }
      } else if (o.phase === 'fall') {
        o.up -= dt / 0.16;
        if (o.up <= 0) holes[i] = null;
      } else if (o.phase === 'hit') {
        if (o.t > 0.4) { o.up -= dt / 0.1; if (o.up <= 0) holes[i] = null; }
      }
    }

    for (const p of puffs) { p.t += dt; p.y -= 45 * S * dt; p.grow = Math.min(1, p.grow + dt * 5); p.alpha = Math.max(0, 1 - p.t / 1.4); }
    puffs = puffs.filter(p => p.t < 1.4);
    for (const h of hammers) h.t += dt;
    hammers = hammers.filter(h => h.t < 0.22);
    for (const s of sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 200 * S * dt; }
    sparks = sparks.filter(s => s.t < s.life);
    for (const p of pops) { p.t += dt; p.y -= 30 * S * dt; }
    pops = pops.filter(p => p.t < p.life);
    shake = Math.max(0, shake - dt);

    if (state === 'play') updateHud();
  }

  // ---------- 렌더 ----------
  function render(t) {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-5, 5) * S, rand(-5, 5) * S);
    drawBackground();
    for (let i = 0; i < 9; i++) drawHole(i, t);
    for (const p of puffs) drawPuff(p);
    for (const h of hammers) drawHammer(h);
    for (const s of sparks) {
      ctx.globalAlpha = 1 - s.t / s.life;
      el(s.x, s.y, s.r, s.r, s.c);
    }
    ctx.globalAlpha = 1;
    if (banner) {
      const k = banner.t / 1.6;
      const sc = k < 0.15 ? 0.5 + k / 0.15 * 0.6 : 1.1 - Math.min(0.1, k - 0.15);
      ctx.save();
      ctx.globalAlpha = k > 0.75 ? 1 - (k - 0.75) / 0.25 : 1;
      ctx.translate(W / 2, H * 0.42); ctx.scale(sc, sc);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.font = `${Math.round(34 * S)}px Jua, 'Malgun Gothic', sans-serif`;
      ctx.lineWidth = 7 * S; ctx.strokeStyle = '#fff'; ctx.strokeText(banner.text, 0, 0);
      ctx.fillStyle = '#ff8a3d'; ctx.fillText(banner.text, 0, 0);
      ctx.font = `${Math.round(18 * S)}px Jua, 'Malgun Gothic', sans-serif`;
      ctx.lineWidth = 5 * S; ctx.strokeText('창현이가 더 빨라져요!', 0, 32 * S);
      ctx.fillStyle = '#a46bd8'; ctx.fillText('창현이가 더 빨라져요!', 0, 32 * S);
      ctx.restore();
    }
    for (const p of pops) {
      const k = p.t / p.life;
      const sc = k < 0.15 ? 0.6 + k / 0.15 * 0.5 : 1.1 - Math.min(0.1, (k - 0.15));
      ctx.save();
      ctx.globalAlpha = 1 - Math.max(0, (k - 0.6) / 0.4);
      ctx.translate(p.x, p.y); ctx.scale(sc, sc);
      ctx.font = `${Math.round(p.size * S)}px Jua, 'Malgun Gothic', sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4 * S; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
      ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------- 루프 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;
    update(dt, t);
    render(t);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  reset();
  initDeco();
  // 시작 전 미리보기: 가운데 구멍에서 창현이가 빼꼼
  holes[4] = { type: 'bandit', phase: 'stay', t: 0, up: 1, stay: 1e9, hit: false, squish: 0 };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
