<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>창현·진경 미니게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#3a3a5a;
    background:linear-gradient(#7cc6f5,#e3f5ff) fixed;
    min-height:100vh;padding:calc(28px + env(safe-area-inset-top)) 16px 90px}
  body::after{content:"";position:fixed;left:0;right:0;bottom:0;height:56px;z-index:-1;
    background:radial-gradient(circle at 20px 22px,#fff4a3 3px,transparent 4px) 0 0/46px 56px,
      linear-gradient(#69bf5b 0 5px,#7fd36f 5px)}
  .wrap{max-width:480px;margin:0 auto}
  h1{text-align:center;color:#fff;font-size:34px;font-weight:normal;
    text-shadow:0 3px 0 #ff5c9a,0 6px 14px rgba(0,0,0,.15);margin-bottom:6px}
  .lead{text-align:center;color:#fff;font-size:17px;margin-bottom:26px;text-shadow:0 1px 3px rgba(0,0,0,.2)}
  .list{display:flex;flex-direction:column;gap:16px}
  .game{display:flex;align-items:center;gap:16px;background:#fff;border-radius:22px;padding:18px;
    text-decoration:none;color:inherit;box-shadow:0 6px 0 #d9d9e8,0 10px 24px rgba(0,0,0,.12);
    transition:transform .1s}
  .game:active{transform:translateY(4px);box-shadow:0 2px 0 #d9d9e8}
  .icon{flex:none;width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:40px}
  .g1 .icon{background:#e3f8d8}
  .g2 .icon{background:#f0eefa}
  .info h2{font-size:23px;font-weight:normal;color:#ff5c9a;margin-bottom:4px}
  .info p{font-size:15px;color:#8a8aa8;line-height:1.45}
  .play{margin-left:auto;flex:none;background:#ff5c9a;color:#fff;border-radius:999px;padding:8px 16px;font-size:17px}
  .game.soon{opacity:.75;box-shadow:0 6px 0 #e4e4ee;pointer-events:none}
  .game.soon .info h2{color:#a0a0bb}
  .game.soon .play{background:#c9c9da}
  .foot{text-align:center;margin-top:28px;color:#6a7fa0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>창현·진경 미니게임</h1>
  <p class="lead">하고 싶은 게임을 골라 주세요!</p>

  <div class="list">
    <a class="game g1" href="./banggu/">
      <div class="icon">💨</div>
      <div class="info">
        <h2>방구 피하기</h2>
        <p>하늘에서 창현이가 뀌는 방구를<br>진경이가 요리조리 피해요</p>
      </div>
      <span class="play">시작</span>
    </a>

    <div class="game g2 soon" aria-disabled="true">
      <div class="icon">🎁</div>
      <div class="info">
        <h2>두 번째 게임</h2>
        <p>곧 만나요! 준비 중이에요</p>
      </div>
      <span class="play">준비 중</span>
    </div>
  </div>

  <p class="foot">휴대폰에서도 바로 할 수 있어요</p>
</div>
</body>
</html>
