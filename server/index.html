<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>순위표 코드 복사</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Jua','Malgun Gothic',sans-serif;background:#e3f5ff;color:#3a3a5a;padding:20px 16px 40px}
  .wrap{max-width:760px;margin:0 auto}
  h1{color:#ff5c9a;font-weight:normal;font-size:28px;margin-bottom:8px}
  p{font-size:16px;line-height:1.6;margin-bottom:12px}
  button{border:none;border-radius:999px;background:#ff5c9a;color:#fff;font-family:inherit;font-size:22px;
    padding:12px 30px;box-shadow:0 5px 0 #d63f7c;cursor:pointer;margin-bottom:14px}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #d63f7c}
  #msg{display:inline-block;margin-left:10px;color:#3aa55b;font-size:18px}
  textarea{width:100%;height:60vh;font-family:Consolas,monospace;font-size:13px;border:2px solid #c9e3f5;
    border-radius:12px;padding:12px;background:#fff;color:#333;white-space:pre}
</style>
</head>
<body>
<div class="wrap">
  <h1>순위표 코드 복사</h1>
  <p>아래 버튼을 누르면 코드 전체가 복사돼요.<br>Apps Script 편집 화면에서 원래 있던 코드를 <b>전부 지운 뒤</b> 붙여넣고 저장하세요.</p>
  <button id="copy">📋 코드 전체 복사</button><span id="msg"></span>
  <textarea id="code" readonly spellcheck="false">불러오는 중…</textarea>
</div>
<script>
  const ta = document.getElementById('code'), msg = document.getElementById('msg');
  fetch('Code.gs?t=' + Date.now()).then(r => r.text()).then(t => {
    ta.value = t;
    msg.textContent = '총 ' + t.split('\n').length + '줄';
  }).catch(() => { ta.value = '코드를 불러오지 못했어요. 새로고침해 주세요.'; });
  document.getElementById('copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(ta.value); }
    catch (_) { ta.focus(); ta.select(); document.execCommand('copy'); }
    msg.textContent = '✔ 복사했어요! (' + ta.value.split('\n').length + '줄)';
  });
</script>
</body>
</html>
