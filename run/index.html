<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>방구 허들 달리기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#bfe6ff;
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
    box-shadow:0 0 40px rgba(0,0,0,.15)}
  #stage{position:relative;flex:1;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;top:calc(10px + env(safe-area-inset-top));padding:6px 14px;border-radius:999px;
    background:rgba(255,255,255,.85);color:#3a3a5a;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:2}
  #score{left:10px}
  #time{right:10px}
  #lives{left:50%;transform:translateX(-50%);font-size:18px;letter-spacing:2px}
  #level{left:10px;top:calc(54px + env(safe-area-inset-top));font-size:16px;padding:3px 12px;color:#fff;background:#ff8a3d}
  #level.up{animation:bump .6s}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  #sound{right:10px;left:auto;top:calc(54px + env(safe-area-inset-top));font-size:18px;padding:3px 12px;border:none;font-family:inherit;cursor:pointer}
  #controls{display:flex;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#5fae55}
  .btn{flex:1;height:84px;border:none;border-radius:20px;background:#fff;color:#ff5c9a;font-size:32px;
    font-family:inherit;box-shadow:0 6px 0 #d9d9e8;touch-action:none;cursor:pointer}
  .btn.on{transform:translateY(4px);box-shadow:0 2px 0 #d9d9e8;background:#ffe3ef}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(40,50,90,.45);z-index:5;padding:16px}
  .overlay.hide{display:none}
  .card{background:#fff;border-radius:24px;padding:26px 24px;text-align:center;width:100%;max-width:320px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);color:#3a3a5a}
  .card h1{font-size:32px;color:#ff5c9a;margin-bottom:10px;font-weight:normal}
  .card p{font-size:17px;line-height:1.6;margin-bottom:6px}
  .card .big{font-size:24px;color:#3a3a5a}
  .card .big b{color:#ff5c9a;font-weight:normal}
  .card .sub{font-size:15px;color:#8a8aa8}
  .card button{margin-top:16px;border:none;border-radius:999px;background:#ff5c9a;color:#fff;
    font-family:inherit;font-size:22px;padding:12px 34px;box-shadow:0 5px 0 #d63f7c;cursor:pointer}
  .card button:active{transform:translateY(3px);box-shadow:0 2px 0 #d63f7c}
  .card .home{display:inline-block;margin-top:12px;color:#8a8aa8;font-size:16px;text-decoration:none}
  .card .line{font-size:16px;color:#8a8aa8;margin-bottom:8px}
  .card .line b{color:#3a3a5a;font-weight:normal}
  .newrec{background:#fff4e0;border-radius:16px;padding:10px 12px;margin:6px 0 10px;color:#ff8a3d;font-size:19px}
  .newrec.hide{display:none}
  .newrec form{display:flex;gap:6px;margin-top:8px}
  .newrec input{flex:1;min-width:0;font-family:inherit;font-size:18px;padding:8px 12px;border:2px solid #ffc999;border-radius:12px;
    outline:none;color:#3a3a5a;user-select:text;-webkit-user-select:text;touch-action:auto}
  .newrec input:focus{border-color:#ff8a3d}
  .card .newrec button{margin:0;padding:8px 16px;font-size:18px;background:#ff8a3d;box-shadow:0 4px 0 #d96a22}
  .newrec .done{color:#3aa55b;font-size:17px}
  .rank{list-style:none;text-align:left;margin:4px 0 0;border-top:2px dashed #eee}
  .rank li{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:2px dashed #eee;font-size:18px}
  .rank .md{width:26px;text-align:center}
  .rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .sc{color:#ff5c9a}
  .rank .tm{width:46px;text-align:right;color:#a0a0bb;font-size:14px}
  .rank li.me{background:#fff0f6;border-radius:10px}
  .rank li.empty{color:#c9c9da}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hud" id="score">점수 0</div>
    <div class="hud" id="level">Lv.1</div>
    <div class="hud" id="lives">❤️❤️❤️</div>
    <div class="hud" id="time">⏱ 00:00</div>
    <button class="hud" id="sound" aria-label="소리 켜기/끄기">🔊</button>

    <div class="overlay" id="startOv">
      <div class="card">
        <h1>방구 허들 달리기</h1>
        <p>앞에 선 <b style="color:#c0392b;font-weight:normal">창현</b>이가 뀌는 방구를<br>
           <b style="color:#ff5c9a;font-weight:normal">진경</b>이가 점프로 뛰어넘어요!</p>
        <p class="sub">점프 버튼 · 화면 터치 · 스페이스바로 점프<br>목숨은 3개, 넘을 때마다 +1점<br>15초마다 레벨 UP! 점점 어려워져요</p>
        <p class="sub" id="topLine" style="color:#ff8a3d"></p>
        <button id="startBtn">시작하기</button><br>
        <a class="home" href="../">← 게임 목록</a>
      </div>
    </div>

    <div class="overlay hide" id="overOv">
      <div class="card">
        <h1 style="margin-bottom:4px">게임 종료</h1>
        <p class="big">점수 <b id="finalScore">0</b>점</p>
        <p class="line">플레이 시간 <b id="finalTime">00:00</b> · 도달 레벨 <b id="finalLevel">1</b></p>
        <div class="newrec hide" id="newRec">
          <div id="newRecMsg">🎉 기록 갱신! <span id="newRank">1</span>위</div>
          <form id="nameForm" autocomplete="off">
            <input id="nameInput" maxlength="8" placeholder="이름을 적어 주세요" enterkeyhint="done">
            <button type="submit">등록</button>
          </form>
        </div>
        <ol class="rank" id="rankList"></ol>
        <p class="sub" id="rankNote" style="margin-top:6px"></p>
        <button id="restartBtn">다시 시작</button><br>
        <a class="home" href="../">← 게임 목록</a>
      </div>
    </div>
  </div>
  <div id="controls">
    <button class="btn" id="jumpBtn" aria-label="점프">▲ 점프</button>
  </div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $score = document.getElementById('score');
  const $time = document.getElementById('time');
  const $lives = document.getElementById('lives');
  const $level = document.getElementById('level');
  const $sound = document.getElementById('sound');
  const startOv = document.getElementById('startOv');
  const overOv = document.getElementById('overOv');

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmt = sec => {
    const s = Math.floor(sec);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };

  let W = 0, H = 0, S = 1;
  const trackY = () => H - 70 * S;          // 진경이 발이 닿는 선
  const playerX = () => Math.max(50 * S, W * 0.14);
  const banditX = () => W - 52 * S;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    const wasEmpty = W < 10;
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = Math.max(0.65, Math.min(1.4, Math.min(W / 400, H / 640)));
    if (player) {
      player.x = playerX();
      if (player.onGround) player.y = trackY();
      bandit.x = banditX(); bandit.y = trackY() - 80 * S;
    }
    if (wasEmpty && W >= 10) initDeco();
  }

  // ---------- 효과음 (방구 피하기와 같은 소리) ----------
  let actx = null, master = null, muted = false;
  try { muted = localStorage.getItem('bangguMute') === '1'; } catch (_) {}
  $sound.textContent = muted ? '🔇' : '🔊';
  function audio() {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0.5; master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  $sound.addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    $sound.textContent = muted ? '🔇' : '🔊';
    try { localStorage.setItem('bangguMute', muted ? '1' : '0'); } catch (_) {}
    if (!muted) { audio(); sfx.dodge(); }
  });
  $sound.addEventListener('pointerdown', e => e.stopPropagation());
  function tone(type, f1, f2, dur, vol, delay = 0, lp = 0, vib = 0) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let node = o;
    if (lp) { const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); node = f; }
    if (vib) {
      const lfo = a.createOscillator(), lg = a.createGain();
      lfo.frequency.value = vib; lg.gain.value = f1 * 0.08;
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t0); lfo.stop(t0 + dur);
    }
    node.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  let lastDodge = 0;
  const sfx = {
    fart() {
      const p = rand(0.85, 1.2);
      tone('square', 190 * p, 95 * p, 0.26, 0.16, 0, 700, 28);
      tone('sine', 380 * p, 520 * p, 0.09, 0.08, 0.2);
    },
    dodge() {
      const now = performance.now(); if (now - lastDodge < 70) return; lastDodge = now;
      tone('sine', 1046, 1568, 0.09, 0.12);
    },
    jump() { tone('sine', 480, 900, 0.12, 0.1); },
    hit() {
      tone('triangle', 620, 160, 0.35, 0.3);
      tone('sine', 300, 90, 0.3, 0.18, 0.05);
    },
    levelUp() { [523, 659, 784, 1046].forEach((f, i) => tone('triangle', f, f, 0.14, 0.18, i * 0.09)); },
    start() { [392, 523, 659].forEach((f, i) => tone('sine', f, f * 1.02, 0.12, 0.16, i * 0.07)); },
    over() { [523, 440, 349, 262].forEach((f, i) => tone('triangle', f, f * 0.97, 0.22, 0.2, i * 0.16)); },
  };

  // ---------- 난이도 ----------
  const LEVEL_SEC = 15;
  const GRAV = 2600, JUMP = 900;            // S 단위 (점프 높이 약 155, 공중 시간 약 0.69초)
  function diff(lv) {
    const n = lv - 1;
    return {
      speed: Math.min(480, 250 + n * 30),                    // 달리는(방구가 다가오는) 속도
      gap: Math.max(0.8, 1.75 * Math.pow(0.9, n)),            // 방구 사이 최소 간격(초)
      gapRand: Math.max(0.25, 0.7 - n * 0.05),                // 간격 랜덤 폭
      pair: lv >= 3 ? Math.min(0.5, (lv - 2) * 0.12) : 0,      // 2연속 방구
      triple: lv >= 7 ? Math.min(0.3, (lv - 6) * 0.08) : 0,    // 3연속 방구
      big: lv >= 4 ? Math.min(0.35, (lv - 3) * 0.08) : 0,      // 왕방구(높음)
      bounce: lv >= 5 ? Math.min(0.45, (lv - 4) * 0.1) : 0,    // 통통 튀는 방구
    };
  }

  // ---------- 상태 ----------
  let state = 'ready';
  let player, bandit, puffs, pops, sparks, queue, score, lives, elapsed, invuln, spawnT, shake, level, banner, scroll, jumpBuf;
  const deco = [];

  function reset() {
    player = { x: playerX(), y: trackY(), vy: 0, onGround: true };
    bandit = { x: banditX(), y: trackY() - 80 * S, squish: 0 };
    puffs = []; pops = []; sparks = []; queue = [];
    score = 0; lives = 3; elapsed = 0; invuln = 0; spawnT = 1.2; shake = 0; level = 1; banner = null; scroll = 0; jumpBuf = 0;
    const m = location.hash.match(/lv=(\d+)/);   // 테스트용: #lv=5
    if (m) { level = Math.max(1, +m[1]); elapsed = (level - 1) * LEVEL_SEC; }
    updateHud();
  }

  function updateHud() {
    $score.textContent = '점수 ' + score;
    $level.textContent = 'Lv.' + level;
    $time.textContent = '⏱ ' + fmt(elapsed);
    $lives.textContent = '❤️'.repeat(lives) + '🤍'.repeat(3 - lives);
  }

  function initDeco() {
    deco.length = 0;
    for (let i = 0; i < 5; i++) deco.push({ x: rand(0, W), y: rand(H * 0.15, H * 0.5), s: rand(0.6, 1.2), v: rand(0.15, 0.3) });
  }

  // ---------- 입력 ----------
  function jump() {
    if (state !== 'play') return;
    jumpBuf = 0.14;   // 착지 직전에 눌러도 점프되도록 잠깐 기억
  }
  const jumpBtn = document.getElementById('jumpBtn');
  jumpBtn.addEventListener('pointerdown', e => { e.preventDefault(); jumpBtn.classList.add('on'); jump(); });
  const btnOff = () => jumpBtn.classList.remove('on');
  jumpBtn.addEventListener('pointerup', btnOff);
  jumpBtn.addEventListener('pointercancel', btnOff);
  jumpBtn.addEventListener('pointerleave', btnOff);
  jumpBtn.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });

  window.addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
      e.preventDefault();
      if (state === 'play') { if (!e.repeat) jump(); }
      else if (e.key === ' ') start();
    }
    if (e.key === 'Enter' && state !== 'play') start();
  });

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('restartBtn').addEventListener('click', start);

  function start() {
    reset();
    audio(); sfx.start();
    state = 'play';
    startOv.classList.add('hide');
    overOv.classList.add('hide');
  }


  // ---------- 순위표 (1~3위) ----------
  // SCORE_API(구글 시트 웹 앱 주소)가 있으면 모든 휴대폰이 같은 순위표를 함께 봄.
  // 주소가 없거나 인터넷이 안 되면 이 기기에 저장해 두었다가 다음에 연결될 때 올림.
  const SCORE_API = '';
  const GAME_ID = 'run';
  const RANK_KEY = 'rank_run', OLD_BEST = 'runBest', PEND_KEY = 'pend_run', SYNC_KEY = 'synced_run';
  const $newRec = document.getElementById('newRec');
  const $nameForm = document.getElementById('nameForm');
  const $nameInput = document.getElementById('nameInput');
  const $rankList = document.getElementById('rankList');
  const $rankNote = document.getElementById('rankNote');
  const $topLine = document.getElementById('topLine');
  let myEntry = null, reqNo = 0, busy = false;
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const lsGet = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
  const jsonList = k => { try { const v = JSON.parse(lsGet(k)); return Array.isArray(v) ? v : null; } catch (_) { return null; } };

  function saveRank(list) { lsSet(RANK_KEY, JSON.stringify(list)); }
  function loadRank() {
    let list = jsonList(RANK_KEY);
    if (!list) {
      // 예전 최고 점수가 있으면 '진경' 이름으로 옮겨 넣기
      list = [];
      const ob = +lsGet(OLD_BEST) || 0;
      if (ob > 0) list.push({ name: '진경', score: ob, time: null, id: newId() });
      saveRank(list);
    }
    return list.filter(e => e && typeof e.score === 'number').map(e => Object.assign({}, e, { id: String(e.id) })).slice(0, 3);
  }
  function addLocal(entry) {
    const list = loadRank();
    let pos = list.findIndex(e => entry.score > e.score);
    if (pos < 0) pos = list.length;
    if (pos < 3) { list.splice(pos, 0, entry); list.length = Math.min(list.length, 3); saveRank(list); }
    return list;
  }
  function renameLocal(id, nm) {
    const list = loadRank();
    const it = list.find(x => x.id === id);
    if (it) { it.name = nm; saveRank(list); }
    const p = jsonList(PEND_KEY) || [];
    const pi = p.find(x => String(x.id) === id);
    if (pi) { pi.name = nm; lsSet(PEND_KEY, JSON.stringify(p)); }
    return list;
  }
  function addPending(e) {
    const p = jsonList(PEND_KEY) || [];
    if (!p.some(x => String(x.id) === e.id)) { p.push(e); lsSet(PEND_KEY, JSON.stringify(p)); }
  }

  async function api(body) {
    if (!SCORE_API) throw new Error('주소 없음');
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 9000);
    try {
      const res = body
        ? await fetch(SCORE_API, { method: 'POST', body: JSON.stringify(Object.assign({ game: GAME_ID }, body)), signal: ctrl.signal })
        : await fetch(SCORE_API + '?game=' + GAME_ID + '&t=' + Date.now(), { signal: ctrl.signal });
      const j = await res.json();
      if (!j.ok || !Array.isArray(j.list)) throw new Error('응답 이상');
      return j.list.map(e => Object.assign({}, e, { id: String(e.id) }));
    } finally { clearTimeout(to); }
  }

  // 못 올린 기록(예전 기록 포함)을 공유 순위표로 올리기
  async function flushPending() {
    if (!SCORE_API) return;
    if (!lsGet(SYNC_KEY)) {
      for (const e of loadRank()) addPending(e);
      lsSet(SYNC_KEY, '1');
    }
    const p = jsonList(PEND_KEY) || [];
    for (const e of p) {
      try {
        await api({ action: 'add', id: String(e.id), name: e.name, score: e.score, time: e.time });
        const now = (jsonList(PEND_KEY) || []).filter(x => String(x.id) !== String(e.id));
        lsSet(PEND_KEY, JSON.stringify(now));
      } catch (_) { break; }
    }
  }

  function renderRank(list) {
    $rankList.innerHTML = '';
    if (!list) {
      const li = document.createElement('li'); li.className = 'empty';
      li.textContent = '⏳ 순위 불러오는 중…';
      $rankList.appendChild(li);
      return;
    }
    const medals = ['🥇', '🥈', '🥉'];
    for (let i = 0; i < 3; i++) {
      const e = list[i];
      const li = document.createElement('li');
      const md = document.createElement('span'); md.className = 'md'; md.textContent = medals[i];
      const nm = document.createElement('span'); nm.className = 'nm';
      const sc = document.createElement('span'); sc.className = 'sc';
      const tm = document.createElement('span'); tm.className = 'tm';
      if (e) {
        nm.textContent = e.name;
        sc.textContent = e.score + '점';
        tm.textContent = e.time == null ? '' : fmt(e.time);
        if (myEntry && e.id === myEntry.id) li.className = 'me';
      } else {
        li.className = 'empty'; nm.textContent = '아직 없음';
      }
      li.append(md, nm, sc, tm);
      $rankList.appendChild(li);
    }
  }
  function showNew(list) {
    const pos = myEntry ? list.findIndex(e => e.id === myEntry.id) : -1;
    if (pos >= 0) {
      document.getElementById('newRecMsg').textContent = '🎉 기록 갱신! ' + (pos + 1) + '위';
      $nameInput.value = myEntry.name;
      $nameForm.style.display = '';
      $newRec.classList.remove('hide');
    } else {
      $newRec.classList.add('hide');
    }
  }
  function note(shared) {
    $rankNote.textContent = !SCORE_API ? '' : shared ? '🌏 모두가 함께 보는 순위표예요' : '📵 인터넷 연결이 안 돼서 이 폰의 기록만 보여요';
  }

  async function recordScore() {
    const my = ++reqNo;
    myEntry = null;
    $newRec.classList.add('hide');
    if (score > 0) myEntry = { id: newId(), name: lsGet('playerName') || '진경', score, time: Math.floor(elapsed) };
    let list = myEntry ? addLocal(myEntry) : loadRank();
    if (!SCORE_API) { renderRank(list); showNew(list); note(false); return; }
    renderRank(null); $rankNote.textContent = '';
    let shared = true;
    try {
      list = myEntry
        ? await api({ action: 'add', id: myEntry.id, name: myEntry.name, score: myEntry.score, time: myEntry.time })
        : await api();
    } catch (_) {
      shared = false;
      if (myEntry) addPending(myEntry);
    }
    if (my !== reqNo) return;
    renderRank(list); showNew(list); note(shared);
  }

  // ---------- 그리기 도우미 ----------

  }

  function drawCloud(x, y, s, alpha = 0.9) {
    ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = '#fff';

    ctx.arc(x + 20 * s, y - 8 * s, 22 * s, 0, Math.PI * 2);

  function drawBackground() {

    const ty = trackY();

    ctx.fillStyle = '#b5e3a6';
    ctx.beginPath(); ctx.moveTo(0, ty - 20 * S);
    const off = (scroll * 0.15) % (260 * S);
    for (let x = -off - 260 * S; x <= W + 260 * S; x += 260 * S) {

    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

    // 잔디
    ctx.fillStyle = '#7fd36f'; ctx.fillRect(0, ty - 22 * S, W, H - ty + 22 * S);
    ctx.fillStyle = '#69bf5b'; ctx.fillRect(0, ty - 22 * S, W, 4 * S);

  function drawLabel(text, x, y, color) {

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  // ---------- 방구 구름 (같은 모양) ----------
  function puffY(p) { return trackY() - p.r * 0.95 - p.hop; }
  function drawPuff(p) {
    ctx.save();
    const y = puffY(p);
    ctx.translate(p.x, y);
    const r = p.r * p.grow;
    // 그림자
    ctx.globalAlpha = 0.18 * p.grow;
    el(0, trackY() - y + 2 * S, r * 0.8, r * 0.18, '#3a3a5a');
    // 뒤쪽 잔상
    for (let i = 1; i <= 3; i++) {
      ctx.globalAlpha = 0.28 / i * p.grow;
      el(r * (0.85 + i * 0.5), Math.sin(p.t * 5 + i) * r * 0.2, r * (0.42 - i * 0.07), r * (0.42 - i * 0.07), '#dff7d6');
    }
    ctx.globalAlpha = 1;
    ctx.rotate(Math.sin(p.t * 3 + p.ph) * 0.12);
    const k = 1 + Math.sin(p.t * 7 + p.ph) * 0.06;
    ctx.scale(k, 1 / k);
    const blobs = [[0, 0.05, 0.8], [-0.55, 0.2, 0.55], [0.55, 0.2, 0.55], [-0.25, -0.4, 0.5], [0.3, -0.38, 0.52]];
    ctx.fillStyle = '#86cf7d';
    for (const [bx, by, br] of blobs) { ctx.beginPath(); ctx.arc(bx * r, by * r, br * r + 2, 0, Math.PI * 2); ctx.fill(); }
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 1.2);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#e3f8d8'); g.addColorStop(1, '#b6e8a8');
    ctx.fillStyle = g;
    for (const [bx, by, br] of blobs) { ctx.beginPath(); ctx.arc(bx * r, by * r, br * r, 0, Math.PI * 2); ctx.fill(); }
    el(-r * 0.22, r * 0.02, r * 0.07, r * 0.09, '#4d6b48');
    el(r * 0.22, r * 0.02, r * 0.07, r * 0.09, '#4d6b48');
    ctx.strokeStyle = '#4d6b48'; ctx.lineWidth = Math.max(1.2, r * 0.06); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, r * 0.14, r * 0.13, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    el(-r * 0.4, r * 0.2, r * 0.1, r * 0.06, 'rgba(255,150,170,.6)');
    el(r * 0.4, r * 0.2, r * 0.1, r * 0.06, 'rgba(255,150,170,.6)');
    ctx.restore();
  }

  // ---------- 효과 ----------
  function addPop(x, y, text, color, size = 22) { pops.push({ x, y, text, color, size, t: 0, life: 0.9 }); }
  function addSparks(x, y, n, colors) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(60, 180) * S;
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40 * S, t: 0, life: rand(0.4, 0.8), r: rand(3, 6) * S, c: colors[i % colors.length] });
    }
  }

  // ---------- 방구 발사 (창현이가 뀌면 길 위로 굴러옴) ----------
  function planGroup() {
    const d = diff(level);
    const roll = Math.random();
    let count = 1;
    if (roll < d.triple) count = 3;
    else if (roll < d.triple + d.pair) count = 2;
    const big = count === 1 && Math.random() < d.big;
    for (let i = 0; i < count; i++) {
      queue.push({ delay: i * 0.17, big, bounce: count === 1 && !big && Math.random() < d.bounce });
    }
    return (count - 1) * 0.17;
  }

  function fart(opt) {
    const r = (opt.big ? rand(27, 31) : rand(15, 19)) * S;
    puffs.push({
      x: bandit.x - 40 * S, r, t: 0, ph: rand(0, 6), hit: false, passed: false, grow: 0.3,
      hop: 0, bounce: opt.bounce, bph: rand(0, Math.PI)
    });
    bandit.squish = 1;
    sfx.fart();
    addPop(bandit.x + rand(-10, 10) * S, bandit.y - 48 * S, '뿡!', '#a46bd8', 22);
    addSparks(bandit.x - 34 * S, trackY() - 14 * S, 6, ['#e9fbe2', '#d4f2c8', '#ffffff']);
  }

  // ---------- 업데이트 ----------
  function update(dt, t) {
    const d = diff(level);
    const speed = (state === 'play' ? d.speed : 90) * S;
    if (state !== 'over') scroll += speed * dt;
    for (const c of deco) {
      if (state !== 'over') c.x -= speed * c.v * dt;
      if (c.x < -110 * S) { c.x = W + rand(10, 80); c.y = rand(H * 0.15, H * 0.5); }
    }
    bandit.squish = Math.max(0, bandit.squish - dt * 3);

    // 진경 점프
    jumpBuf = Math.max(0, jumpBuf - dt);
    if (state === 'play' && jumpBuf > 0 && player.onGround) {
      player.vy = -JUMP * S; player.onGround = false; jumpBuf = 0;
      sfx.jump();
    }
    if (!player.onGround) {
      player.vy += GRAV * S * dt;
      player.y += player.vy * dt;
      if (player.y >= trackY()) {
        player.y = trackY(); player.vy = 0; player.onGround = true;
        addSparks(player.x, trackY(), 4, ['#ffffff', '#f7c9a3']);
      }
    }

    if (state === 'play') {
      elapsed += dt;
      const nl = 1 + Math.floor(elapsed / LEVEL_SEC);
      if (nl > level) {
        level = nl;
        banner = { t: 0, text: '레벨 UP! Lv.' + level };
        $level.classList.remove('up'); void $level.offsetWidth; $level.classList.add('up');
        sfx.levelUp();
      }
      invuln = Math.max(0, invuln - dt);
      spawnT -= dt;
      if (spawnT <= 0) {
        const groupLen = planGroup();
        const nd = diff(level);
        spawnT = groupLen + nd.gap + rand(0, nd.gapRand);
      }
      for (const q of queue) q.delay -= dt;
      while (queue.length && queue[0].delay <= 0) fart(queue.shift());
    }
    if (banner) { banner.t += dt; if (banner.t > 1.6) banner = null; }

    // 방구 이동 + 충돌
    const hb = { l: player.x - 12 * S, r: player.x + 12 * S, t: player.y - 98 * S, b: player.y - 4 * S };
    for (const p of puffs) {
      p.t += dt;
      p.grow = Math.min(1, p.grow + dt * 5);
      if (state !== 'over') p.x -= speed * dt;
      if (p.bounce) p.hop = Math.abs(Math.sin(p.t * 4.2 + p.bph)) * 46 * S;
      if (state !== 'play' || p.hit || p.passed) continue;
      const py = puffY(p);
      const cx = clamp(p.x, hb.l, hb.r), cy = clamp(py, hb.t, hb.b);
      if (invuln <= 0 && Math.hypot(p.x - cx, py - cy) < p.r * 0.75) {
        p.hit = true; lives--; invuln = 1.3; shake = 0.25;
        if (lives > 0) sfx.hit();
        addPop(player.x, player.y - 118 * S, '앗!', '#ff4d6d', 26);
        addSparks(p.x, py, 12, ['#d4f2c8', '#ffffff', '#b6e8a8']);
        if (lives <= 0) { lives = 0; updateHud(); gameOver(); }
      } else if (p.x + p.r < hb.l) {
        p.passed = true; score++;
        sfx.dodge();
        addPop(player.x, player.y - 118 * S, '+1', '#ff5c9a', 20);
      }
    }
    puffs = puffs.filter(p => !p.hit && p.x > -60 * S);

    for (const s of sparks) { s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 200 * S * dt; }
    sparks = sparks.filter(s => s.t < s.life);
    for (const p of pops) { p.t += dt; p.y -= 30 * S * dt; }
    pops = pops.filter(p => p.t < p.life);
    shake = Math.max(0, shake - dt);

    if (state === 'play') updateHud();
  }

  // ---------- 렌더 ----------
  function render(t) {
    ctx.save();
    if (shake > 0) ctx.translate(rand(-5, 5) * S, rand(-5, 5) * S);
    drawBackground();
    drawBandit(bandit, t);
    for (const p of puffs) drawPuff(p);
    drawGirl(player, t);
    drawLabel('창현', bandit.x, trackY() + 12 * S, '#c0392b');
    drawLabel('진경', player.x, player.y + 12 * S, '#ff3d8b');
    for (const s of sparks) {
      ctx.globalAlpha = 1 - s.t / s.life;
      el(s.x, s.y, s.r, s.r, s.c);
    }
    ctx.globalAlpha = 1;
    if (banner) {
      const k = banner.t / 1.6;
      const sc = k < 0.15 ? 0.5 + k / 0.15 * 0.6 : 1.1 - Math.min(0.1, k - 0.15);
      ctx.save();
      ctx.globalAlpha = k > 0.75 ? 1 - (k - 0.75) / 0.25 : 1;
      ctx.translate(W / 2, H * 0.3); ctx.scale(sc, sc);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.font = `${Math.round(34 * S)}px Jua, 'Malgun Gothic', sans-serif`;
      ctx.lineWidth = 7 * S; ctx.strokeStyle = '#fff'; ctx.strokeText(banner.text, 0, 0);
      ctx.fillStyle = '#ff8a3d'; ctx.fillText(banner.text, 0, 0);
      ctx.font = `${Math.round(18 * S)}px Jua, 'Malgun Gothic', sans-serif`;
      ctx.lineWidth = 5 * S; ctx.strokeText('방구가 더 빨라져요!', 0, 32 * S);
      ctx.fillStyle = '#a46bd8'; ctx.fillText('방구가 더 빨라져요!', 0, 32 * S);
      ctx.restore();
    }
    for (const p of pops) {
      const k = p.t / p.life;
      const sc = k < 0.15 ? 0.6 + k / 0.15 * 0.5 : 1.1 - Math.min(0.1, (k - 0.15));
      ctx.save();
      ctx.globalAlpha = 1 - Math.max(0, (k - 0.6) / 0.4);
      ctx.translate(p.x, p.y); ctx.scale(sc, sc);
      ctx.font = `${Math.round(p.size * S)}px Jua, 'Malgun Gothic', sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 4 * S; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
      ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------- 루프 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;
    update(dt, t);
    render(t);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  reset();
  initDeco();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
